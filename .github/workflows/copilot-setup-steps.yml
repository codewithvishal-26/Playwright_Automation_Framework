name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - 'ai-agents/package.json'
      - 'ai-agents/package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - 'ai-agents/package.json'
      - 'ai-agents/package-lock.json'

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agent project dependencies
        working-directory: ai-agents
        run: npm ci
      - name: Install Chromium for Playwright MCP and sample tests
        working-directory: ai-agents
        run: npx playwright install --with-deps chromium
