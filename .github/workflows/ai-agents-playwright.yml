name: Playwright AI Agents Sample Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'ai-agents/**'
      - '.github/agents/**'
      - '.vscode/mcp.json'
      - '.github/workflows/ai-agents-playwright.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'ai-agents/**'
      - '.github/agents/**'
      - '.vscode/mcp.json'
      - '.github/workflows/ai-agents-playwright.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-agents/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-agent-sample-report
          path: |
            ai-agents/playwright-report/
            ai-agents/test-results/
          retention-days: 14
